AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NotaCampus - plataforma de feedback de aulas (Tech Challenge - Fase 4).
  API Gateway + 3 funções Lambda em Java 21 (serverless) + DynamoDB + SNS + S3/SQS + CloudWatch.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Nome do stage do API Gateway.
  AdminEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Destinatário administrativo autorizado para urgências, relatórios e alarmes. Não concede acesso à AWS.
  RetencaoLogsDias:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
    Description: Dias de retenção dos logs no CloudWatch.

Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        # Reduz o tempo de cold start da JVM (compilação C1 apenas)
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"

Resources:
  # ---------------------------------------------------------------------------
  # Dados
  # ---------------------------------------------------------------------------
  AvaliacoesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-avaliacoes"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: dia, AttributeType: S }
        - { AttributeName: dataEnvio, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: dia-index
          KeySchema:
            - { AttributeName: dia, KeyType: HASH }
            - { AttributeName: dataEnvio, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  EnviosTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-envios"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------
  # Mensageria / notificações
  # ---------------------------------------------------------------------------
  NotificacaoTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-notificacoes"
      DisplayName: NotaCampus - Notificações
      KmsMasterKeyId: alias/aws/sns

  NotificacaoSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificacaoTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # Tópico de alarmes sem KMS gerenciado: o CloudWatch não consegue publicar
  # em tópicos cifrados com a chave aws/sns.
  AlarmesTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarmes"
      DisplayName: NotaCampus - Alarmes

  AlarmesSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmesTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # Avisos dos lotes arquivados; os eventos completos ficam no S3 para sobreviver à retenção do Stream.
  NotificacaoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-notificacao-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      VisibilityTimeout: 600

  NotificacaoDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificacaoDLQ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificacaoDLQ.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                # Nome explícito evita dependência circular entre bucket e política da fila.
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}-falhas"

  FalhasNotificacaoBucket:
    Type: AWS::S3::Bucket
    DependsOn: NotificacaoDLQPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}-falhas"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt NotificacaoDLQ.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: aws/lambda/

  FalhasNotificacaoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FalhasNotificacaoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FalhasNotificacaoBucket.Arn
              - !Sub "${FalhasNotificacaoBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------------------------------------------------------------------------
  # Submissão sem login individual. A API key identifica o cliente para consumo, não o aluno.
  # ---------------------------------------------------------------------------
  AvaliacaoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref Stage
      ApiKeySourceType: HEADER
      TracingEnabled: true
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
          Throttle:
            RateLimit: 10
            BurstLimit: 20
          Quota:
            Limit: 10000
            Period: DAY
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      Models:
        AvaliacaoModel:
          type: object
          required: [descricao, nota]
          additionalProperties: false
          properties:
            descricao:
              type: string
              minLength: 1
              maxLength: 1000
            nota:
              type: integer
              minimum: 0
              maximum: 10

  # ---------------------------------------------------------------------------
  # Função 1 - recebe e persiste a avaliação (POST /avaliacao)
  # ---------------------------------------------------------------------------
  ReceberAvaliacaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-receber-avaliacao"
      Description: Valida, classifica a urgência e grava a avaliação no DynamoDB.
      CodeUri: functions/receber-avaliacao/
      Handler: br.com.notacampus.receber.ReceberAvaliacaoHandler::handleRequest
      Environment:
        Variables:
          TABLE_NAME: !Ref AvaliacoesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AvaliacoesTable.Arn
      Events:
        PostAvaliacao:
          Type: Api
          Properties:
            RestApiId: !Ref AvaliacaoApi
            Path: /avaliacao
            Method: post
            RequestModel:
              Model: AvaliacaoModel
              Required: true
              ValidateBody: true

  # ---------------------------------------------------------------------------
  # Função 2 - notifica o administrador sobre avaliações críticas
  # Disparada pelo DynamoDB Streams (apenas INSERT com urgência CRITICA).
  # ---------------------------------------------------------------------------
  NotificarUrgenciaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-notificar-urgencia"
      Description: Envia e-mail (SNS) ao administrador para avaliações críticas.
      CodeUri: functions/notificar-urgencia/
      Handler: br.com.notacampus.notificar.NotificarUrgenciaHandler::handleRequest
      Environment:
        Variables:
          TOPIC_ARN: !Ref NotificacaoTopic
          ENVIOS_TABLE_NAME: !Ref EnviosTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt EnviosTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["URGENCIA#*"]
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificacaoTopic
            # O alias não é um ARN de chave: limita key/* pelo alias e pelo uso no SNS deste tópico.
            - Sid: UsarChaveSnsNotificacoes
              Effect: Allow
              Action:
                - kms:GenerateDataKey*
                - kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                ForAnyValue:StringEquals:
                  kms:ResourceAliases: alias/aws/sns
                StringEquals:
                  kms:ViaService: !Sub "sns.${AWS::Region}.${AWS::URLSuffix}"
                  kms:EncryptionContext:aws:sns:topicArn: !Ref NotificacaoTopic
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt FalhasNotificacaoBucket.Arn
              Condition:
                StringEquals:
                  s3:ResourceAccount: !Ref AWS::AccountId
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${FalhasNotificacaoBucket.Arn}/aws/lambda/*"
              Condition:
                StringEquals:
                  s3:ResourceAccount: !Ref AWS::AccountId
      Events:
        StreamAvaliacoes:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AvaliacoesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            # Permite recuperar reservas de 180s após timeout; falhas persistentes vão à DLQ em até 1h.
            MaximumRetryAttempts: -1
            MaximumRecordAgeInSeconds: 3600
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                # Permissões S3 explícitas acima; omite Type para não gerar uma política SAM mais ampla.
                Destination: !GetAtt FalhasNotificacaoBucket.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"urgencia":{"S":["CRITICA"]}}}}'

  # ---------------------------------------------------------------------------
  # Função 3 - relatório semanal (agendada via EventBridge)
  # Toda segunda-feira às 08:00 (America/Sao_Paulo) = 11:00 UTC.
  # ---------------------------------------------------------------------------
  RelatorioSemanalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-relatorio-semanal"
      Description: Gera o relatório semanal de feedbacks e envia por e-mail (SNS).
      CodeUri: functions/relatorio-semanal/
      Handler: br.com.notacampus.relatorio.RelatorioSemanalHandler::handleRequest
      Timeout: 120
      Environment:
        Variables:
          TABLE_NAME: !Ref AvaliacoesTable
          INDEX_NAME: dia-index
          TOPIC_ARN: !Ref NotificacaoTopic
          ENVIOS_TABLE_NAME: !Ref EnviosTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt EnviosTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["RELATORIO#*"]
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt AvaliacoesTable.Arn
                - !Sub "${AvaliacoesTable.Arn}/index/dia-index"
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificacaoTopic
            - Sid: UsarChaveSnsNotificacoes
              Effect: Allow
              Action:
                - kms:GenerateDataKey*
                - kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                ForAnyValue:StringEquals:
                  kms:ResourceAliases: alias/aws/sns
                StringEquals:
                  kms:ViaService: !Sub "sns.${AWS::Region}.${AWS::URLSuffix}"
                  kms:EncryptionContext:aws:sns:topicArn: !Ref NotificacaoTopic
      Events:
        AgendaSemanal:
          Type: Schedule
          Properties:
            Name: !Sub "${AWS::StackName}-relatorio-semanal"
            Description: Dispara o relatório semanal toda segunda-feira às 08:00 (BRT).
            Schedule: cron(0 11 ? * MON *)
            Enabled: true

  # ---------------------------------------------------------------------------
  # Logs com retenção definida
  # ---------------------------------------------------------------------------
  ReceberAvaliacaoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-receber-avaliacao"
      RetentionInDays: !Ref RetencaoLogsDias

  NotificarUrgenciaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-notificar-urgencia"
      RetentionInDays: !Ref RetencaoLogsDias

  RelatorioSemanalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-relatorio-semanal"
      RetentionInDays: !Ref RetencaoLogsDias

  # ---------------------------------------------------------------------------
  # Monitoramento: alarmes -> e-mail do administrador
  # ---------------------------------------------------------------------------
  ReceberAvaliacaoErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-receber-avaliacao-erros"
      AlarmDescription: Falhas de execução da Lambda (exceções não tratadas ou timeouts). Falhas de persistência tratadas como HTTP 500 são monitoradas pelo alarme api-5xx.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ReceberAvaliacaoFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmesTopic]

  NotificarUrgenciaErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-notificar-urgencia-erros"
      AlarmDescription: A função notificar-urgencia registrou erros (e-mails críticos podem não ter sido enviados).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref NotificarUrgenciaFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmesTopic]

  RelatorioSemanalErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-relatorio-semanal-erros"
      AlarmDescription: A função relatorio-semanal falhou.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref RelatorioSemanalFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmesTopic]

  ArquivamentoFalhasAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-arquivamento-falhas"
      AlarmDescription: O Lambda não conseguiu preservar um lote com falha no destino S3.
      Namespace: AWS/Lambda
      MetricName: DestinationDeliveryFailures
      Dimensions:
        - { Name: FunctionName, Value: !Ref NotificarUrgenciaFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmesTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: Respostas HTTP 5XX da API, incluindo falhas de persistência tratadas por receber-avaliacao. Dispara com pelo menos uma ocorrência em 5 minutos.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - { Name: ApiName, Value: !Sub "${AWS::StackName}-api" }
        - { Name: Stage, Value: !Ref Stage }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmesTopic]

  DlqMensagensAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-dlq-mensagens"
      AlarmDescription: Há avisos de lotes de notificações aguardando recuperação na DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt NotificacaoDLQ.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmesTopic]

  # Políticas de acesso humano: sem associação automática a usuários, grupos ou roles.
  # O provisionador as vincula a identidades federadas autorizadas, com MFA no provedor de identidade.
  ObservacaoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-observacao"
      Description: Observação da aplicação sem leitura de avaliações, arquivos de falha ou API key.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Ref AWS::StackId
          - Effect: Allow
            Action: [lambda:GetFunctionConfiguration]
            Resource:
              - !GetAtt ReceberAvaliacaoFunction.Arn
              - !GetAtt NotificarUrgenciaFunction.Arn
              - !GetAtt RelatorioSemanalFunction.Arn
          - Effect: Allow
            Action: dynamodb:DescribeTable
            Resource: [!GetAtt AvaliacoesTable.Arn, !GetAtt EnviosTable.Arn]
          - Effect: Allow
            Action: [logs:DescribeLogStreams, logs:GetLogEvents, logs:FilterLogEvents]
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*"
          - Effect: Allow
            Action: [cloudwatch:DescribeAlarms, cloudwatch:DescribeAlarmHistory]
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*"
          - Effect: Allow
            Action: cloudwatch:GetDashboard
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${AWS::StackName}-dashboard"
          - Effect: Allow
            Action: [cloudwatch:ListMetrics, cloudwatch:GetMetricData, cloudwatch:GetMetricStatistics, logs:DescribeLogGroups]
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

  RecuperacaoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-recuperacao"
      Description: Recuperação autorizada de notificações e geração manual de relatórios, sem alterar comprovantes de envio.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Ref AWS::StackId
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:ChangeMessageVisibility, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !GetAtt NotificacaoDLQ.Arn
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "${FalhasNotificacaoBucket.Arn}/aws/lambda/*"
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt FalhasNotificacaoBucket.Arn
            Condition:
              StringLike:
                s3:prefix: ["aws/lambda/*"]
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt AvaliacoesTable.Arn
          - Effect: Allow
            Action: [dynamodb:GetShardIterator, dynamodb:GetRecords]
            Resource: !Sub "${AvaliacoesTable.Arn}/stream/*"
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: [!GetAtt NotificarUrgenciaFunction.Arn, !GetAtt RelatorioSemanalFunction.Arn]

  GestaoChavePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-gestao-chave"
      Description: Consulta e administração da API key de consumo desta stack, sem acesso aos feedbacks.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Ref AWS::StackId
          - Effect: Allow
            Action: [apigateway:GET, apigateway:PATCH]
            Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys/${AvaliacaoApiApiKey}"

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda - Invocações",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ReceberAvaliacaoFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${NotificarUrgenciaFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${RelatorioSemanalFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda - Falhas de execução",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ReceberAvaliacaoFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotificarUrgenciaFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${RelatorioSemanalFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway - Requisições e erros",
                "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}-api", "Stage", "${Stage}"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}-api", "Stage", "${Stage}"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}-api", "Stage", "${Stage}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway - Latência (ms)",
                "region": "${AWS::Region}", "stat": "Average", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "${AWS::StackName}-api", "Stage", "${Stage}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "DLQ - Mensagens pendentes",
                "region": "${AWS::Region}", "stat": "Maximum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificacaoDLQ.QueueName}"]
                ]
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: Submissão sem login individual (POST). x-api-key é exigida para controle de consumo.
    Value: !Sub "https://${AvaliacaoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/avaliacao"
  ApiKeyId:
    Description: ID da chave de consumo, não uma identidade de aluno. Somente o gestor autorizado consulta seu valor.
    Value: !Ref AvaliacaoApiApiKey
  TabelaAvaliacoes:
    Value: !Ref AvaliacoesTable
  TabelaEnvios:
    Value: !Ref EnviosTable
  TopicoNotificacoes:
    Value: !Ref NotificacaoTopic
  NotificacaoDLQUrl:
    Value: !Ref NotificacaoDLQ
  FalhasNotificacaoBucketNome:
    Value: !Ref FalhasNotificacaoBucket
  NotificarUrgenciaFunctionArn:
    Value: !GetAtt NotificarUrgenciaFunction.Arn
  PoliticaObservacaoArn:
    Value: !Ref ObservacaoPolicy
  PoliticaRecuperacaoArn:
    Value: !Ref RecuperacaoPolicy
