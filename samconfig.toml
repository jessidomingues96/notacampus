version = 0.1

[default.global.parameters]
stack_name = "notacampus"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
region = "sa-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
# AdminEmail é obrigatório e deve ser passado no deploy:
#   sam deploy --parameter-overrides AdminEmail=voce@exemplo.com
