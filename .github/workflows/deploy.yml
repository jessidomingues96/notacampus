name: CI/CD - NotaCampus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # necessário para autenticação OIDC na AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}

jobs:
  test:
    name: Testes (Java 21) e validação do template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Testes unitários (JUnit)
        run: mvn -B test
      - name: Validar template (cfn-lint)
        run: sam validate --lint --region "$AWS_REGION"
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy

  deploy:
    name: Deploy na AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Credenciais AWS (OIDC, sem chaves de longa duração)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build (Maven)
        run: sam build --parallel
      - name: Deploy
        run: |
          sam deploy \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "AdminEmail=${{ secrets.ADMIN_EMAIL }} Stage=prod"
