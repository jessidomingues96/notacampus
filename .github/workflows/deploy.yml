name: CI/CD - NotaCampus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
  STACK_NAME: notacampus

jobs:
  test:
    name: Testes (Java 21) e validação do template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Exigir fontes e testes em cada função
        run: python3 scripts/validar_testes.py --fontes
      - name: Testes unitários (JUnit, sem relatórios antigos)
        run: mvn -B clean test
      - name: Exigir execução real dos testes em cada função
        run: python3 scripts/validar_testes.py --relatorios
      - name: Testes Python (suíte obrigatória)
        run: python3 scripts/validar_testes.py --python
      - name: Validar template (cfn-lint)
        run: sam validate --lint --region "$AWS_REGION"
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy

  deploy:
    name: Deploy na AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: notacampus-producao
      cancel-in-progress: false
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Credenciais AWS (OIDC, sem chaves de longa duração)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build (Maven)
        run: sam build --parallel
      - name: Deploy
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          : "${ADMIN_EMAIL:?Secret ADMIN_EMAIL obrigatório}"
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "AdminEmail=$ADMIN_EMAIL" "Stage=prod"
      - name: Verificar recursos e API após o deploy
        timeout-minutes: 8
        run: python3 scripts/verificar_deploy.py --stack "$STACK_NAME" --region "$AWS_REGION"
